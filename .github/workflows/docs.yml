name: docs

# Build the documentation, keep the HTML as the workflow artifact docs-html
# and signal spm1d.org so that the site fetches the new build (needs the
# secret SITE_DISPATCH_TOKEN; without it that step is skipped).  The pinned
# versions are needed by doc/_templates/layout.html (Sphinx < 7) and by the
# validation figures (numpy < 2).  The figures use Times New Roman.
#
# Runs as the last step of a release (publish.yml calls it), or by hand for a
# docs-only fix (Actions -> docs -> Run workflow), which is refused on any
# branch other than master.

on:
  workflow_call:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Refuse a manual run on a branch other than master
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          echo "::error::docs can only be run by hand on master, not on $GITHUB_REF_NAME"
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install LaTeX and Times New Roman
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update && sudo apt-get install -y texlive-latex-extra cm-super dvipng ttf-mscorefonts-installer

      - name: Install dependencies
        run: pip install "sphinx==6.2.1" "sphinx_rtd_theme==1.2.2" "numpy<2" scipy matplotlib .

      - name: Build
        run: python -m sphinx -E -a -b html doc doc/build/html
        env:
          MPLBACKEND: Agg

      - name: Upload the HTML
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: doc/build/html

      - name: Notify the site
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "no SITE_DISPATCH_TOKEN; skipped"; exit 0; fi
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/spm1d-org/spm1d.org/dispatches \
              -d "{\"event_type\": \"docs-updated\", \"client_payload\": {\"child\": \"rft1d\", \"run_id\": \"$GITHUB_RUN_ID\"}}"
