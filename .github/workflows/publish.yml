name: publish

# Publishing is triggered by pushing a version tag, e.g.
#
#     python update_version.py          # bump 0.2.5 -> 0.2.6 everywhere
#     git commit -am 'version 0.2.6'
#     git tag v0.2.6
#     git push && git push --tags
#
# Pushing to master no longer publishes anything, so a version bump landing on
# master cannot release by accident.
#
# The token-based upload below still works;  PyPI's recommended alternative is
# Trusted Publishing, which removes the stored secret entirely.  To switch:
# configure this repository and workflow as a trusted publisher on PyPI, add
# "permissions: id-token: write" to the publish job, and drop the "password"
# input.  See https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags: ['v*']

jobs:

  test:
    # a tag must pass the full matrix before anything is uploaded
    uses: ./.github/workflows/test.yml

  publish:
    name: build and upload to PyPI
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The version lives in three places (__init__.py, pyproject.toml and the
      # README badge) and is synced by hand with update_version.py, so verify
      # the tag agrees with the package before uploading anything.  A PyPI
      # release cannot be replaced once published.
      - name: Check that the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import sys; sys.path.insert(0, 'src'); import rft1d; print(rft1d.__version__)")
          PRJ=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag                    : $TAG"
          echo "rft1d.__version__      : $PKG"
          echo "pyproject.toml version : $PRJ"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$PRJ" ]; then
            echo "::error::tag, __init__.py and pyproject.toml disagree -- run update_version.py"
            exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install -U pip build twine

      - name: Build
        run: python -m build .

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_TOKEN }}