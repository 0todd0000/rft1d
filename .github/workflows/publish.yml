name: publish

# Publishing is triggered by pushing a version tag, e.g.
#
#     python update_version.py          # bump 0.2.5 -> 0.2.6 everywhere
#     git commit -am 'version 0.2.6'
#     git tag v0.2.6
#     git push && git push --tags
#
# Pushing to master no longer publishes anything, so a version bump landing on
# master cannot release by accident.
#
# The token-based upload below still works;  PyPI's recommended alternative is
# Trusted Publishing, which removes the stored secret entirely.  To switch:
# configure this repository and workflow as a trusted publisher on PyPI, add
# "permissions: id-token: write" to the publish job, and drop the "password"
# input.  See https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags: ['v*']

jobs:

  test:
    # a tag must pass the full matrix before anything is uploaded
    uses: ./.github/workflows/test.yml

  publish:
    name: build and upload to PyPI
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The version lives in three places (__init__.py, pyproject.toml and the
      # README badge) and is synced by hand with update_version.py, so verify
      # the tag agrees with the package before uploading anything.  A PyPI
      # release cannot be replaced once published.
      #
      # __version__ is read with ast rather than by importing rft1d: importing
      # the package pulls in numpy and scipy, which this job has no reason to
      # install, and this check should run before anything else happens.
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast, os, sys, tomllib

          tag = os.environ['TAG'].lstrip('v')

          pkg = None
          for node in ast.parse(open('src/rft1d/__init__.py').read()).body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == '__version__':
                          pkg = node.value.value
          if pkg is None:
              sys.exit('::error::no __version__ assignment in src/rft1d/__init__.py')

          prj = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']

          print(f'tag                    : {tag}')
          print(f'rft1d.__version__      : {pkg}')
          print(f'pyproject.toml version : {prj}')

          if not (tag == pkg == prj):
              print('::error::tag, __init__.py and pyproject.toml disagree'
                    ' -- run update_version.py')
              sys.exit(1)
          PY

      - name: Install build dependencies
        run: python -m pip install -U pip build twine

      - name: Build
        run: python -m build .

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_TOKEN }}