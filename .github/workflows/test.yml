name: test

# Runs on every branch and every pull request, so problems surface when they
# are introduced rather than at release time.  publish.yml calls this workflow
# (workflow_call) so that a release is still gated on a green test run.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U pytest numpy scipy matplotlib

      # NOTE: rft1d is deliberately NOT installed here.  tests/conftest.py puts
      # ./src at the front of sys.path, so this also checks that the test suite
      # can find its own source without any environment setup.
      - name: Run tests
        run: python -m pytest tests/

  build:
    name: build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -U pip build twine

      - name: Build
        run: python -m build .

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Show what would ship
        run: python -m zipfile --list dist/*.whl